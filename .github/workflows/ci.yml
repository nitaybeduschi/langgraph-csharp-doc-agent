name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run quality gates
        id: quality
        shell: bash
        env:
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
          PYTEST_ADDOPTS: "--basetemp=.tmp/pytest"
        run: |
          mkdir -p .ci-logs
          set +e

          python -m ruff check app tests scripts 2>&1 | tee .ci-logs/ruff.log
          ruff_status=${PIPESTATUS[0]}

          python -m mypy app 2>&1 | tee .ci-logs/mypy.log
          mypy_status=${PIPESTATUS[0]}

          python -m pytest -q 2>&1 | tee .ci-logs/pytest.log
          pytest_status=${PIPESTATUS[0]}

          if [ "$ruff_status" -ne 0 ] || [ "$mypy_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
            exit 1
          fi

      - name: Analyze failed build logs
        if: failure()
        env:
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          LANGCHAIN_CALLBACKS_BACKGROUND: "false"
        run: |
          python scripts/ai_log_analyzer.py --log-dir .ci-logs --json-output .ci-logs/analysis.json
